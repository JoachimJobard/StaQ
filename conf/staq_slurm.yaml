# Cluster entry point for the BASELINE StaQ, so its runs land next to the StoRAQ
# ones with the same naming and the same resources.
#
# Requires the launcher plugin once:   uv add hydra-submitit-launcher
#
#   uv run python -m src.staq --config-name=staq_slurm -m \
#       env=walker2d seed=0,1,2,3,4
#
# NOTE: the hydra.launcher block below is duplicated in conf/storaq_slurm.yaml.
# Kept inline deliberately -- these are cluster parameters, and a divergence here
# costs a resubmission, whereas sharing them adds a resolution order that fails
# only at submit time. Change both together.
defaults:
  - config
  - override hydra/launcher: submitit_slurm
  - _self_

device: cuda

hydra:
  sweep:
    dir: /data/tau/iceberg_1/titanic_1/users/${oc.env:USER}/staq/multirun/${now:%Y-%m-%d_%H-%M-%S}
  launcher:
    partition: tau,gpu-best
    timeout_min: 2880          # 48:00:00
    cpus_per_task: 8           # matches the sbatch allocation (cfg.torch_threads stays 4)
    mem_gb: 32
    gpus_per_node: 1
    nodes: 1
    tasks_per_node: 1
    # CUDA 13 (torch cu130) needs sm_75+; excludes volta (V100) and pascal.
    constraint: "ampere|hopper|turing|rtx"
    array_parallelism: 16
    setup:
      - export PATH="$HOME/.local/bin:$PATH"
      - export WANDB_DIR="/data/tau/iceberg_1/titanic_1/users/$USER/staq/wandb"
      - mkdir -p "$WANDB_DIR"
